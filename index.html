<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Discover and book wedding, birthday and party venues near you."
    />
    <title>Wedezy — Find the perfect place for your big day</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/inter@latest/400.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/inter@latest/500.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/inter@latest/600.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/inter@latest/700.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/inter@latest/800.css" />
  </head>
  <body>
    <div id="root"></div>
    <!-- GitHub Pages SPA redirect receiver.
         Pairs with public/404.html — decodes the path that was encoded into
         the query string and restores it before React/Router initialises. -->
    <script>
      ;(function () {
        var params = new URLSearchParams(window.location.search)
        var p = params.get('p')
        if (!p) return
        var q = params.get('q')
        params.delete('p')
        params.delete('q')
        var search =
          (q ? '?' + q.replace(/~and~/g, '&') : '') +
          (params.toString() ? (q ? '&' : '?') + params.toString() : '')
        window.history.replaceState(
          null,
          null,
          '/wedezy' + p + search + window.location.hash,
        )
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
